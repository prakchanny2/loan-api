# .github/workflows/pipeline.yml: test -> build and push -> deploy -> verify
name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python train.py
      - run: pytest -v

  build-and-push:
    needs: test                                     # only if every test passed
    if: github.event_name != 'pull_request'         # pull requests are tested, never deployed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build the image, stamped with this commit, and push both tags
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loan-api
          docker build -f Dockerfile.prod --build-arg GIT_SHA=${{ github.sha }} \
            -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push --all-tags $IMAGE

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ask Render to deploy this commit's image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loan-api:${{ github.sha }}
          ENCODED=$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "$IMAGE")
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&imgURL=$ENCODED"

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait until the live API reports this commit
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL repository variable is not configured"
            exit 1

          fi

          health_url="${APP_URL%/}/health"
          deadline=$((SECONDS + 900))
          attempt=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            response=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
              --write-out $'\n%{http_code}' "$health_url" 2>/dev/null || true)
            http_status="${response##*$'\n'}"
            health_body="${response%$'\n'*}"
            live_sha=$(printf '%s' "$health_body" | python3 -c \
              'import json, sys; data = json.load(sys.stdin); print(data.get("git_sha", "") if isinstance(data, dict) else "")' \
              2>/dev/null || true)

            if [ "$http_status" = "200" ] && [ "$live_sha" = "${{ github.sha }}" ]; then
              echo "Deployed and healthy: $live_sha"
              exit 0
            fi

            echo "Waiting for deployment: HTTP ${http_status:-000}, SHA '${live_sha:-unavailable}' (attempt $attempt)"
            sleep 10
          done
          echo "The new version did not become healthy within 15 minutes"
          exit 1